<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lider Büro-Sen | Yönetim Paneli</title>

<style>
* { box-sizing:border-box; }

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f7;
  color:#222;
}

header{
  background:#8b1118;
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  width:min(1000px,94%);
  margin:30px auto;
}

.card{
  background:white;
  border-radius:14px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 7px 25px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#8b1118;
}

input,button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:7px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  background:#8b1118;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#6f0d13;
}

.logout{
  background:#333;
}

.yonetici{
  display:grid;
  grid-template-columns:100px 1fr auto;
  gap:18px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #ddd;
}

.yonetici img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}

.yonetici h3{
  margin:0;
}

.yonetici p{
  margin:5px 0;
  color:#666;
}

.sil{
  width:auto;
  background:#c62828;
  padding:10px 15px;
}

#panel{
  display:none;
}

.mesaj{
  margin-top:15px;
  font-weight:bold;
}

.bilgi{
  background:#fff3cd;
  padding:15px;
  border-radius:8px;
  margin-bottom:20px;
  line-height:1.5;
}

@media(max-width:650px){
  .yonetici{
    grid-template-columns:80px 1fr;
  }

  .yonetici img{
    width:75px;
    height:75px;
  }

  .sil{
    grid-column:1 / 3;
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>Lider Büro-Sen</h1>
  <div>Yönetim Paneli</div>
</header>

<div class="container">

<div class="card" id="login">

<h2>Yönetici Girişi</h2>

<input
type="email"
id="email"
placeholder="E-posta adresi">

<input
type="password"
id="password"
placeholder="Şifre">

<button id="girisBtn">
Giriş Yap
</button>

<div class="mesaj" id="loginMesaj"></div>

</div>

<div id="panel">

<div class="bilgi">
<strong>Fotoğraf kullanımı:</strong><br>
Fotoğrafı önce GitHub deposuna yükleyin.
Daha sonra aşağıdaki Fotoğraf Dosya Adı bölümüne
örneğin <strong>fatih.jpeg</strong> yazın.
</div>

<div class="card">

<h2>Yönetici Ekle</h2>

<input
type="text"
id="ad"
placeholder="Ad Soyad">

<input
type="text"
id="gorev"
placeholder="Görevi">

<input
type="number"
id="sira"
placeholder="Sıra (1, 2, 3...)">

<input
type="text"
id="foto"
placeholder="Fotoğraf dosya adı (örnek: fatih.jpeg)">

<button id="kaydetBtn">
Yönetici Ekle
</button>

<div class="mesaj" id="kayitMesaj"></div>

</div>

<div class="card">

<h2>Mevcut Yönetim</h2>

<div id="yonetimListe">
Yükleniyor...
</div>

</div>

<button
class="logout"
id="cikisBtn">
Çıkış Yap
</button>

</div>

</div>

<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyDO-VfmmLRrc1KS8SaVcaIR94pnc5M4g",
  authDomain: "lider-burosen-web.firebaseapp.com",
  projectId: "lider-burosen-web",
  storageBucket: "lider-burosen-web.firebasestorage.app",
  messagingSenderId: "883869377747",
  appId: "1:883869377747:web:90AE255db06aad942FA026"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const login = document.getElementById("login");
const panel = document.getElementById("panel");
const loginMesaj = document.getElementById("loginMesaj");
const kayitMesaj = document.getElementById("kayitMesaj");

document
.getElementById("girisBtn")
.addEventListener("click", async () => {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginMesaj.innerText =
      "Giriş başarılı.";

  } catch(error) {

    loginMesaj.innerText =
      "Giriş başarısız: " + error.message;

  }

});

document
.getElementById("cikisBtn")
.addEventListener("click", async () => {

  await signOut(auth);

});

onAuthStateChanged(auth, (user) => {

  if(user){

    login.style.display = "none";
    panel.style.display = "block";

  } else {

    login.style.display = "block";
    panel.style.display = "none";

  }

});

document
.getElementById("kaydetBtn")
.addEventListener("click", async () => {

  const ad =
    document.getElementById("ad").value.trim();

  const gorev =
    document.getElementById("gorev").value.trim();

  const sira =
    Number(
      document.getElementById("sira").value
    ) || 99;

  const foto =
    document.getElementById("foto").value.trim();

  if(!ad || !gorev || !foto){

    kayitMesaj.innerText =
      "Ad, görev ve fotoğraf dosya adı zorunludur.";

    return;

  }

  try {

    kayitMesaj.innerText =
      "Kaydediliyor...";

    await addDoc(
      collection(db,"yonetim"),
      {
        ad:ad,
        gorev:gorev,
        foto:foto,
        sira:sira,
        createdAt:serverTimestamp()
      }
    );

    document.getElementById("ad").value = "";
    document.getElementById("gorev").value = "";
    document.getElementById("sira").value = "";
    document.getElementById("foto").value = "";

    kayitMesaj.innerText =
      "Yönetici başarıyla eklendi.";

  } catch(error) {

    kayitMesaj.innerText =
      "Hata: " + error.message;

  }

});

const liste =
  document.getElementById("yonetimListe");

onSnapshot(
  collection(db,"yonetim"),
  (snapshot) => {

    const yoneticiler =
      snapshot.docs
      .map(item => ({
        id:item.id,
        ...item.data()
      }))
      .sort(
        (a,b) =>
        (a.sira || 99) -
        (b.sira || 99)
      );

    liste.innerHTML = "";

    yoneticiler.forEach((kisi) => {

      const div =
        document.createElement("div");

      div.className =
        "yonetici";

      div.innerHTML = `

        <img
        src="${kisi.foto}"
        alt="${kisi.ad}">

        <div>
          <h3>${kisi.ad}</h3>
          <p>${kisi.gorev}</p>
          <small>${kisi.foto}</small>
        </div>

        <button
        class="sil"
        data-id="${kisi.id}">
        Sil
        </button>

      `;

      liste.appendChild(div);

    });

    document
    .querySelectorAll(".sil")
    .forEach((button) => {

      button.addEventListener(
        "click",
        async () => {

          const id =
            button.dataset.id;

          if(
            confirm(
              "Bu yöneticiyi silmek istediğinize emin misiniz?"
            )
          ){

            await deleteDoc(
              doc(db,"yonetim",id)
            );

          }

        }
      );

    });

    if(yoneticiler.length === 0){

      liste.innerHTML =
        "Henüz yönetici eklenmemiş.";

    }

  }
);

</script>

</body>
</html>
