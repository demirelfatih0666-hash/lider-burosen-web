<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lider Büro-Sen | Yönetim Paneli</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f7;
  color:#222;
}

header{
  background:#8b1118;
  color:#fff;
  padding:22px;
  text-align:center;
}

header h1{
  margin:0;
}

header p{
  margin:5px 0 0;
}

.container{
  width:min(1100px,94%);
  margin:25px auto;
}

#login{
  max-width:500px;
  margin:50px auto;
}

.card{
  background:white;
  border-radius:14px;
  padding:25px;
  margin-bottom:22px;
  box-shadow:0 6px 25px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#8b1118;
}

input,
button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:7px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  background:#8b1118;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#6f0d13;
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:22px;
}

.menu button{
  margin:0;
}

.secondary{
  background:#30343b;
}

.preview{
  margin-top:15px;
  display:none;
}

.preview img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:12px;
  border:3px solid #eee;
}

.yonetici{
  display:grid;
  grid-template-columns:100px 1fr 110px;
  gap:18px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:15px 0;
}

.yonetici img{
  width:90px;
  height:90px;
  border-radius:12px;
  object-fit:cover;
}

.yonetici h3{
  margin:0;
}

.yonetici p{
  margin:5px 0 0;
  color:#666;
}

.sil{
  background:#c62828;
  width:auto;
}

.mesaj{
  margin-top:15px;
  font-weight:bold;
}

.ok{
  color:#087b39;
}

.hata{
  color:#b71c1c;
}

#panel{
  display:none;
}

.bilgi{
  background:#fff4d6;
  border-left:5px solid #e0a800;
  padding:14px;
  margin-bottom:18px;
  border-radius:8px;
}

@media(max-width:750px){
  .menu{
    grid-template-columns:1fr;
  }

  .yonetici{
    grid-template-columns:80px 1fr;
  }

  .yonetici img{
    width:75px;
    height:75px;
  }

  .yonetici .sil{
    grid-column:1 / 3;
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>Lider Büro-Sen</h1>
  <p>Yönetim Paneli</p>
</header>

<div class="container">

  <div class="card" id="login">

    <h2>Yönetici Girişi</h2>

    <input
      type="email"
      id="email"
      placeholder="E-posta adresi"
    >

    <input
      type="password"
      id="password"
      placeholder="Şifre"
    >

    <button id="girisBtn">
      Giriş Yap
    </button>

    <div class="mesaj" id="loginMesaj"></div>

  </div>


  <div id="panel">

    <div class="menu">

      <button onclick="bolumAc('yonetimBolum')">
        Yönetim
      </button>

      <button
        class="secondary"
        onclick="window.open('index.html','_blank')">
        Siteyi Aç
      </button>

      <button
        class="secondary"
        id="cikisBtn">
        Çıkış Yap
      </button>

    </div>


    <div id="yonetimBolum">

      <div class="card">

        <h2>Yönetici Ekle</h2>

        <div class="bilgi">
          Fotoğrafı bilgisayarınızdan seçin.
          Sistem fotoğrafı otomatik olarak küçültüp
          siteye uygun hale getirecektir.
        </div>

        <input
          type="text"
          id="ad"
          placeholder="Ad Soyad"
        >

        <input
          type="text"
          id="gorev"
          placeholder="Görevi"
        >

        <input
          type="number"
          id="sira"
          placeholder="Sıra (1, 2, 3...)"
        >

        <input
          type="file"
          id="foto"
          accept="image/jpeg,image/png,image/webp"
        >

        <div class="preview" id="preview">
          <img id="previewImg">
        </div>

        <button id="kaydetBtn">
          Yönetici Ekle
        </button>

        <div
          class="mesaj"
          id="kayitMesaj">
        </div>

      </div>


      <div class="card">

        <h2>Mevcut Yönetim</h2>

        <div id="yonetimListe">
          Yükleniyor...
        </div>

      </div>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCyDO-VfmmLRrc1KS8SaVcaIR94pnc5M4g",

  authDomain:
  "lider-burosen-web.firebaseapp.com",

  projectId:
  "lider-burosen-web",

  messagingSenderId:
  "883869377747",

  appId:
  "1:883869377747:web:90AE255db06aad942FA026"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const login =
document.getElementById("login");

const panel =
document.getElementById("panel");

const loginMesaj =
document.getElementById("loginMesaj");

const kayitMesaj =
document.getElementById("kayitMesaj");


window.bolumAc = function(id){

  document
  .querySelectorAll("#panel > div[id$='Bolum']")
  .forEach(el => {
    el.style.display = "none";
  });

  const bolum =
  document.getElementById(id);

  if(bolum){
    bolum.style.display = "block";
  }

};


document
.getElementById("girisBtn")
.addEventListener("click", async () => {

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  loginMesaj.innerText =
  "Giriş yapılıyor...";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginMesaj.innerText = "";

  }catch(error){

    loginMesaj.innerText =
    "Giriş başarısız: " + error.message;

  }

});


document
.getElementById("cikisBtn")
.addEventListener("click", async () => {

  await signOut(auth);

});


onAuthStateChanged(auth, (user) => {

  if(user){

    login.style.display = "none";

    panel.style.display = "block";

  }else{

    login.style.display = "block";

    panel.style.display = "none";

  }

});


const fotoInput =
document.getElementById("foto");

const preview =
document.getElementById("preview");

const previewImg =
document.getElementById("previewImg");


fotoInput.addEventListener("change", () => {

  const file =
  fotoInput.files[0];

  if(!file){
    preview.style.display = "none";
    return;
  }

  previewImg.src =
  URL.createObjectURL(file);

  preview.style.display = "block";

});


async function fotografHazirla(file){

  return new Promise((resolve,reject) => {

    const reader =
    new FileReader();

    reader.onload = function(event){

      const img =
      new Image();

      img.onload = function(){

        const maxBoyut = 650;

        let width = img.width;
        let height = img.height;

        if(width > height){

          if(width > maxBoyut){

            height =
            Math.round(
              height * maxBoyut / width
            );

            width = maxBoyut;

          }

        }else{

          if(height > maxBoyut){

            width =
            Math.round(
              width * maxBoyut / height
            );

            height = maxBoyut;

          }

        }


        const canvas =
        document.createElement("canvas");

        canvas.width = width;

        canvas.height = height;


        const ctx =
        canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        const dataUrl =
        canvas.toDataURL(
          "image/jpeg",
          0.68
        );


        if(dataUrl.length > 700000){

          reject(
            new Error(
              "Fotoğraf hâlâ çok büyük. Daha küçük bir fotoğraf seçin."
            )
          );

          return;

        }


        resolve(dataUrl);

      };


      img.onerror = function(){

        reject(
          new Error(
            "Fotoğraf okunamadı."
          )
        );

      };


      img.src =
      event.target.result;

    };


    reader.onerror = function(){

      reject(
        new Error(
          "Dosya okunamadı."
        )
      );

    };


    reader.readAsDataURL(file);

  });

}


document
.getElementById("kaydetBtn")
.addEventListener("click", async () => {

  const ad =
  document.getElementById("ad")
  .value
  .trim();

  const gorev =
  document.getElementById("gorev")
  .value
  .trim();

  const sira =
  Number(
    document
    .getElementById("sira")
    .value
  ) || 99;

  const fotoDosyasi =
  fotoInput.files[0];


  if(!ad || !gorev || !fotoDosyasi){

    kayitMesaj.className =
    "mesaj hata";

    kayitMesaj.innerText =
    "Ad, görev ve fotoğraf zorunludur.";

    return;

  }


  try{

    kayitMesaj.className =
    "mesaj";

    kayitMesaj.innerText =
    "Fotoğraf hazırlanıyor...";


    const fotoData =
    await fotografHazirla(
      fotoDosyasi
    );


    kayitMesaj.innerText =
    "Yönetici kaydediliyor...";


    await addDoc(
      collection(
        db,
        "yonetim"
      ),
      {

        ad: ad,

        gorev: gorev,

        sira: sira,

        foto: fotoData,

        createdAt:
        serverTimestamp()

      }
    );


    document
    .getElementById("ad")
    .value = "";

    document
    .getElementById("gorev")
    .value = "";

    document
    .getElementById("sira")
    .value = "";

    fotoInput.value = "";

    preview.style.display =
    "none";


    kayitMesaj.className =
    "mesaj ok";

    kayitMesaj.innerText =
    "Yönetici başarıyla eklendi.";

  }catch(error){

    kayitMesaj.className =
    "mesaj hata";

    kayitMesaj.innerText =
    "Hata: " + error.message;

  }

});


const liste =
document.getElementById(
  "yonetimListe"
);


onSnapshot(

collection(
  db,
  "yonetim"
),

(snapshot) => {

  const yoneticiler =
  snapshot.docs
  .map(item => ({

    id:item.id,

    ...item.data()

  }))
  .sort(
    (a,b) =>
    (a.sira || 99) -
    (b.sira || 99)
  );


  liste.innerHTML = "";


  yoneticiler.forEach(
  (kisi) => {

    const div =
    document.createElement(
      "div"
    );

    div.className =
    "yonetici";


    div.innerHTML = `

      <img
      src="${kisi.foto || ""}"
      alt="${kisi.ad || ""}">

      <div>

        <h3>
          ${kisi.ad || ""}
        </h3>

        <p>
          ${kisi.gorev || ""}
        </p>

      </div>

      <button
      class="sil"
      data-id="${kisi.id}">
        Sil
      </button>

    `;


    liste.appendChild(div);

  });


  document
  .querySelectorAll(".sil")
  .forEach((button) => {

    button.addEventListener(
    "click",
    async () => {

      const id =
      button.dataset.id;

      const onay =
      confirm(
        "Bu yöneticiyi silmek istediğinize emin misiniz?"
      );

      if(!onay) return;


      try{

        await deleteDoc(
          doc(
            db,
            "yonetim",
            id
          )
        );

      }catch(error){

        alert(
          "Silme hatası: " +
          error.message
        );

      }

    });

  });


  if(
    yoneticiler.length === 0
  ){

    liste.innerHTML =
    "Henüz yönetici eklenmemiş.";

  }

},

(error) => {

  liste.innerHTML =
  "Liste yüklenemedi: " +
  error.message;

}

);

</script>

</body>
</html>
