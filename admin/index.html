<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lider Büro-Sen Yönetim Paneli</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><section id="login" class="card"><h1>Lider Büro-Sen</h1><h2>Yönetim Paneli</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="loginBtn">Giriş Yap</button><p id="loginMsg"></p></section><section id="panel" class="hidden"><header><div><h1>Yönetim Paneli</h1><p>Haber ve duyuruları yönetin</p></div><button id="logoutBtn" class="secondary">Çıkış</button></header><div class="card"><h2 id="formTitle">Yeni İçerik</h2><input id="title" placeholder="Başlık"><select id="type"><option value="haber">Haber</option><option value="duyuru">Duyuru</option></select><textarea id="summary" placeholder="Kısa açıklama / spot"></textarea><textarea id="content" placeholder="İçerik"></textarea><label><input id="published" type="checkbox" checked> Yayında</label><div class="actions"><button id="saveBtn">Kaydet</button><button id="cancelBtn" class="secondary hidden">İptal</button></div><p id="formMsg"></p></div><div class="card"><h2>İçerikler</h2><div id="items">Yükleniyor...</div></div></section></main><script type="module" src="admin.js"></script></body></html>
